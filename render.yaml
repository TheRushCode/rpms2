services:
  # -------------------------------------------------------------
  # 1. Backend Web Service (Spring Boot 3 + Java 21)
  # -------------------------------------------------------------
  - type: web
    name: rpms-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: rpms-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false

# -------------------------------------------------------------
# 2. Render Managed PostgreSQL Database
# -------------------------------------------------------------
databases:
  - name: rpms-postgres
    plan: free
    region: oregon
    databaseName: rpms_db
    user: rpms_user
